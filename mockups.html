<!DOCTYPE html>
<html lang="en">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>

    body {

    .header {

      margin: 0 auto 30px;

    .eyebrow {

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .card-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.80rem;
      font-weight: 800;
      color: var(--accent-gold);
      background: rgba(245, 208, 140, 0.12);

      border-radius: 6px;

    .card-title {
      font-size: 1.18rem;
      font-weight: 800;
      color: #ffffff;
      flex-grow: 1;
      margin-left: 10px;
    }
    .card-desc {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .comparison-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #090c12;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px;

    .state-row {
      display: flex;
      flex-direction: column;

    .state-label-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;

    .state-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;

    }
    .state-badge.active {
      color: #fde68a;
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .state-desc {
      font-size: 0.72rem;
      color: #64748b;
    }
    .preview-canvas-wrap {
      background: radial-gradient(circle at 50% 50%, #151c27 0%, #080a0e 100%);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 8px 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    }
    .specs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }
    .spec-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.08);

  </style>
</head>
<body>

  <div class="header">
    <div class="eyebrow">Design Showcase</div>
    <h1>Bubble Number Style Mockups</h1>
    <p class="sub">Compare <strong>Highlight (Active in-play)</strong> and <strong>Lowlight (Completed goal-met)</strong> versions across 5 gemstone colors (Emerald Green, Amber, Chalcedony Blue, Ruby, Diamond White).</p>
    
    <div class="actions-bar">
      <a href="/" class="btn-nav">← Back to Game</a>
    </div>

    <div class="tab-switcher">
      <button class="tab-btn active" id="tabCarved">🗿 Carved & Etched Glass (15 Styles)</button>
      <button class="tab-btn" id="tabClose">🎨 Close Tone-on-Tone (15 Styles)</button>
      <button class="tab-btn" id="tabTonal">🌈 Harmonic Tonal (15 Styles)</button>
      <button class="tab-btn" id="tabThemed">💎 Themed & Materials (15 Styles)</button>
    </div>
  </div>

  <div class="grid" id="mockupGrid"></div>

  <script type="module">
    import { Renderer } from './renderer.js';

    const renderer = new Renderer();

    const sampleGems = [
      { color: 'green', num: '140', name: 'Emerald' },
      { color: 'amber', num: '98', name: 'Amber' },
      { color: 'blue', num: '162', name: 'Sapphire' },
      { color: 'red', num: '85', name: 'Ruby' },
      { color: 'white', num: '196', name: 'Diamond' }
    ];

    // ========================================================
    // SET 0: CARVED & ETCHED GLASS (15 STYLES)
    // High translucency, intaglio, engraved, chiseled & etched
    // ========================================================
    const carvedStyles = [
      {
        id: 1,
        title: "Sunken Glass Intaglio (Specular Rim + Cavity Well)",
        desc: "Highlight: top specular catchlight on upper carved bevel, deep cavity shadow, 52% translucent body exposing the bubble fluid. Lowlight: calm 22% translucent wash with soft depth.",
        specs: ["Carve: Upper Specular / Lower Shadow", "Alpha: 52% Translucent", "Vibe: True Sunken Intaglio"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.92);
          ctx.font = `800 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          const s = gem.isWhite ? 10 : Math.round(gem.s * 100);

          // 1. Top rim specular catchlight
          ctx.fillStyle = `hsla(${h}, ${Math.max(20, s * 0.7)}%, 94%, 0.85)`;
          ctx.fillText(num, x, y - 1.4);

          // 2. Cavity drop shadow
          ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
          ctx.fillText(num, x, y + 1.4);

          // 3. Translucent interior (52% alpha)
          ctx.fillStyle = `hsla(${h}, ${s}%, 84%, 0.52)`;
          ctx.fillText(num, x, y);
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.84);
          ctx.font = `600 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.fillText(num, x, y - 1.0);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.fillText(num, x, y + 1.0);
          ctx.fillStyle = `hsla(${h}, 20%, 65%, 0.22)`;
          ctx.fillText(num, x, y);
        }
      },
      {
        id: 2,
        title: "Laser-Etched Frosted Groove (Micro-Chamfer Cut)",
        desc: "Highlight: subtle dark groove trench, bright top specular chamfer, and diffuse frosted core at 48% alpha. Lowlight: faint etched glass line with 20% frosted wash.",
        specs: ["Trench: Micro-Chamfer Stroke", "Alpha: 48% Diffuse Frosted", "Vibe: Laser-Etched Crystal"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.92);
          ctx.font = `800 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          const s = gem.isWhite ? 10 : Math.round(gem.s * 100);

          ctx.strokeStyle = 'rgba(0, 0, 0, 0.65)';
          ctx.lineWidth = Math.max(2.4, fs * 0.10);
          ctx.strokeText(num, x, y + 0.6);

          ctx.strokeStyle = `hsla(${h}, 30%, 96%, 0.75)`;
          ctx.lineWidth = Math.max(1.2, fs * 0.05);
          ctx.strokeText(num, x, y - 1.2);

          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
          ctx.shadowBlur = 3;
          ctx.fillStyle = `hsla(${h}, ${Math.round(s * 0.45)}%, 90%, 0.48)`;
          ctx.fillText(num, x, y);
          ctx.restore();
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.84);
          ctx.font = `600 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
          ctx.lineWidth = 1.6;
          ctx.strokeText(num, x, y + 0.5);
          ctx.fillStyle = `hsla(${h}, 15%, 70%, 0.20)`;
          ctx.fillText(num, x, y);
        }
      },
      {
        id: 3,
        title: "Beveled Bas-Relief (3D Concave Chisel)",
        desc: "Highlight: 45° angled chisel facets with upper-left specular rim, bottom-right deep shade, and 45% translucent face. Lowlight: calm chiseled relief.",
        specs: ["Bevel: 45° Dual Specular", "Alpha: 45% Translucent Face", "Vibe: Sculptured Bas-Relief"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.92);
          ctx.font = `900 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          const s = gem.isWhite ? 10 : Math.round(gem.s * 100);

          ctx.fillStyle = `hsla(${h}, ${Math.max(20, s * 0.6)}%, 95%, 0.82)`;
          ctx.fillText(num, x - 1.3, y - 1.3);

          ctx.fillStyle = `hsla(${h}, ${s}%, 10%, 0.75)`;
          ctx.fillText(num, x + 1.4, y + 1.4);

          ctx.fillStyle = `hsla(${h}, ${s}%, 80%, 0.45)`;
          ctx.fillText(num, x, y);
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.84);
          ctx.font = `600 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.fillText(num, x - 1.0, y - 1.0);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.40)';
          ctx.fillText(num, x + 1.0, y + 1.0);
          ctx.fillStyle = `hsla(${h}, 20%, 65%, 0.20)`;
          ctx.fillText(num, x, y);
        }
      },
      {
        id: 4,
        title: "Prismatic V-Groove (Gem-Cutter Facet Cut)",
        desc: "Highlight: sharp V-shaped cuts catching outer specular glint with dark interior incision and 40% translucent core. Lowlight: subtle prismatic V-cut.",
        specs: ["Cut: Dual V-Angle Facets", "Alpha: 40% Translucent", "Vibe: Crystal Glassware"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.92);
          ctx.font = `800 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          const s = gem.isWhite ? 10 : Math.round(gem.s * 100);

          ctx.save();
          ctx.shadowColor = 'rgba(0,0,0,0.7)';
          ctx.shadowBlur = 3;
          ctx.strokeStyle = `hsla(${h}, ${s}%, 94%, 0.75)`;
          ctx.lineWidth = Math.max(3.0, fs * 0.12);
          ctx.strokeText(num, x, y - 0.6);
          ctx.restore();

          ctx.strokeStyle = 'rgba(3, 7, 18, 0.88)';
          ctx.lineWidth = Math.max(1.8, fs * 0.07);
          ctx.strokeText(num, x, y + 0.8);

          ctx.fillStyle = `hsla(${h}, ${s}%, 86%, 0.40)`;
          ctx.fillText(num, x, y);
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.84);
          ctx.font = `600 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.lineWidth = 2;
          ctx.strokeText(num, x, y - 0.5);
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.lineWidth = 1.2;
          ctx.strokeText(num, x, y + 0.6);
          ctx.fillStyle = `hsla(${h}, 20%, 65%, 0.18)`;
          ctx.fillText(num, x, y);
        }
      },
      {
        id: 5,
        title: "Concave Caustic Lens (Spherical Dip Refraction)",
        desc: "Highlight: spherical curved dip with top cavity shadow transitioning into luminous bottom caustic bounce. Lowlight: calm concave lens wash.",
        specs: ["Optics: Concave Gradient Dip", "Alpha: 45% Translucent", "Vibe: Polished Lens Indentation"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.92);
          ctx.font = `800 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          const s = gem.isWhite ? 10 : Math.round(gem.s * 100);

          ctx.fillStyle = `hsla(${h}, 30%, 96%, 0.75)`;
          ctx.fillText(num, x, y - 1.2);

          const grad = ctx.createLinearGradient(x, y - fs * 0.45, x, y + fs * 0.45);
          grad.addColorStop(0, 'rgba(0, 0, 0, 0.75)');
          grad.addColorStop(0.40, `hsla(${h}, ${s}%, 45%, 0.45)`);
          grad.addColorStop(1, `hsla(${h}, ${s}%, 90%, 0.70)`);
          ctx.fillStyle = grad;
          ctx.fillText(num, x, y);
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.84);
          ctx.font = `600 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          const grad = ctx.createLinearGradient(x, y - fs * 0.4, x, y + fs * 0.4);
          grad.addColorStop(0, 'rgba(0, 0, 0, 0.45)');
          grad.addColorStop(1, `hsla(${h}, 20%, 75%, 0.28)`);
          ctx.fillStyle = grad;
          ctx.fillText(num, x, y);
        }
      },
      {
        id: 6,
        title: "Acid-Etched Matte Silhouette (Micro-Frost Watermark)",
        desc: "Highlight: diffuse matte frosted finish with soft ambient cavity occlusion and 50% opacity. Lowlight: whisper-quiet etched ghost.",
        specs: ["Texture: Acid-Etched Matte", "Alpha: 50% Frosted", "Vibe: Subtle Glass Frost"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.92);
          ctx.font = `800 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          const s = gem.isWhite ? 10 : Math.round(gem.s * 100);

          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.70)';
          ctx.shadowBlur = 4;
          ctx.shadowOffsetY = 1.2;
          ctx.fillStyle = `hsla(${h}, ${Math.max(10, Math.round(s * 0.4))}%, 90%, 0.50)`;
          ctx.fillText(num, x, y);
          ctx.restore();

          ctx.strokeStyle = `hsla(${h}, ${s}%, 96%, 0.40)`;
          ctx.lineWidth = 1;
          ctx.strokeText(num, x, y);
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.84);
          ctx.font = `600 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
          ctx.shadowBlur = 2;
          ctx.fillStyle = `hsla(${h}, 15%, 70%, 0.22)`;
          ctx.fillText(num, x, y);
          ctx.restore();
        }
      },
      {
        id: 7,
        title: "Deep Crystal Intaglio (-30% Dark Cavity Void)",
        desc: "Highlight: deeply chiseled dark void revealing thick glass refraction, topped by brilliant specular reflection lip. Lowlight: muted dark intaglio.",
        specs: ["Core: Deep Dark Void (-30% L)", "Lip: Specular Caustic Edge", "Vibe: Heavy Carved Crystal"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.92);
          ctx.font = `900 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          const s = gem.isWhite ? 10 : Math.round(gem.s * 100);

          ctx.fillStyle = `hsla(${h}, ${Math.max(20, s * 0.6)}%, 96%, 0.90)`;
          ctx.fillText(num, x, y - 1.6);

          ctx.save();
          ctx.shadowColor = 'rgba(0,0,0,0.85)';
          ctx.shadowBlur = 3;
          ctx.fillStyle = `hsla(${h}, ${Math.max(50, s)}%, 12%, 0.85)`;
          ctx.fillText(num, x, y);
          ctx.restore();

          ctx.fillStyle = `hsla(${h}, ${s}%, 80%, 0.35)`;
          ctx.fillText(num, x, y + 0.6);
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.84);
          ctx.font = `600 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.fillText(num, x, y - 1.0);
          ctx.fillStyle = `hsla(${h}, 30%, 16%, 0.50)`;
          ctx.fillText(num, x, y);
        }
      },
      {
        id: 8,
        title: "Hollow Watermark (Negative Space Glass Cutout)",
        desc: "Highlight: nearly transparent interior (28% alpha) framed by a crisp refractive dark rim and upper specular edge. Lowlight: subtle cut outline.",
        specs: ["Alpha: 28% Ultra-Translucent", "Rim: Refractive Dual Edge", "Vibe: Negative Space Stencil"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.92);
          ctx.font = `800 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          const s = gem.isWhite ? 10 : Math.round(gem.s * 100);

          ctx.strokeStyle = 'rgba(0, 0, 0, 0.80)';
          ctx.lineWidth = Math.max(2.4, fs * 0.09);
          ctx.strokeText(num, x, y + 0.6);

          ctx.strokeStyle = `hsla(${h}, 30%, 96%, 0.82)`;
          ctx.lineWidth = Math.max(1.2, fs * 0.045);
          ctx.strokeText(num, x, y - 1.2);

          ctx.fillStyle = `hsla(${h}, ${s}%, 86%, 0.28)`;
          ctx.fillText(num, x, y);
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.84);
          ctx.font = `600 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const h = gem.isWhite ? 210 : gem.h;
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.40)';
          ctx.lineWidth = 1.6;

      {
        id: 7,
        title: "Swiss Slate Minimal",
        desc: "Highlight: crisp flat off-white (#F8FAFC) with 1px graphite offset shadow. Lowlight: muted slate (#94A3B8 at 50%) with zero bloom.",
        specs: ["Highlight: #F8FAFC Crisp Flat", "Lowlight: #94A3B8 (50% Opacity)", "Vibe: Modern Swiss Graphic"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.95);
          ctx.font = `800 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
          ctx.shadowBlur = 2;
          ctx.shadowOffsetX = 1;
          ctx.shadowOffsetY = 2;
          ctx.fillStyle = '#f8fafc';
          ctx.fillText(num, x, y);
          ctx.restore();
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.88);
          ctx.font = `600 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
          ctx.shadowBlur = 1;
          ctx.shadowOffsetY = 1;
          ctx.fillStyle = 'rgba(148, 163, 184, 0.50)';
          ctx.fillText(num, x, y);
          ctx.restore();
        }
      },
      {
        id: 8,
        title: "Prismatic Iridescent Sheen",
        desc: "Highlight: optical interference rainbow sheen (Pink -> Mint -> Sky Blue). Lowlight: desaturated soft pearlescent silver.",
        specs: ["Highlight: Spectrum Gradient", "Lowlight: Pearl Silver Tint", "Vibe: Soap Bubble Spectrum"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.95);
          ctx.font = `900 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.strokeStyle = '#05070e';
          ctx.lineWidth = Math.max(3.2, fs * 0.12);
          ctx.strokeText(num, x, y);

          const grad = ctx.createLinearGradient(x - fs * 0.5, y - fs * 0.5, x + fs * 0.5, y + fs * 0.5);
          grad.addColorStop(0, '#fbcfe8');
          grad.addColorStop(0.33, '#fed7aa');
          grad.addColorStop(0.66, '#a7f3d0');
          grad.addColorStop(1.0, '#bae6fd');
          ctx.fillStyle = grad;
          ctx.fillText(num, x, y);
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.88);
          ctx.font = `600 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.save();
          ctx.shadowColor = 'rgba(0,0,0,0.7)';
          ctx.shadowBlur = 2;
          ctx.fillStyle = 'rgba(226, 232, 240, 0.50)';
          ctx.fillText(num, x, y);
          ctx.restore();
        }
      },
      {
        id: 9,
        title: "Liquid Silver Chrome",
        desc: "Highlight: dual-horizon metallic chrome gradient with polished edge. Lowlight: brushed pewter-slate at 50% opacity.",
        specs: ["Highlight: Chrome Horizon Gradient", "Lowlight: Brushed Matte Pewter", "Vibe: Futuristic Chrome"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.95);
          ctx.font = `900 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.strokeStyle = '#090d16';
          ctx.lineWidth = Math.max(3.5, fs * 0.14);
          ctx.strokeText(num, x, y);

          const grad = ctx.createLinearGradient(x, y - fs * 0.5, x, y + fs * 0.5);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.48, '#e2e8f0');
          grad.addColorStop(0.52, '#64748b');
          grad.addColorStop(0.85, '#cbd5e1');
          grad.addColorStop(1.0, '#ffffff');
          ctx.fillStyle = grad;
          ctx.fillText(num, x, y);
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.88);
          ctx.font = `600 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.save();
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 2;
          ctx.fillStyle = 'rgba(148, 163, 184, 0.55)';
          ctx.fillText(num, x, y);
          ctx.restore();
        }
      },
      {
        id: 10,
        title: "3D Beveled Brilliant Cut",
        desc: "Highlight: sculptured gem relief with top-left specular facet and bottom-right shade. Lowlight: flattened subtle relief.",
        specs: ["Highlight: Dual Light Offset", "Lowlight: Muted Soft Emboss", "Vibe: Chiseled Crystal"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.94);
          ctx.font = `900 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.fillStyle = '#78350f';
          ctx.fillText(num, x + 1.8, y + 1.8);

          ctx.fillStyle = '#ffffff';
          ctx.fillText(num, x - 1.2, y - 1.2);

          ctx.fillStyle = '#fbbf24';
          ctx.fillText(num, x, y);
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.86);
          ctx.font = `600 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
          ctx.fillText(num, x - 1, y - 1);

          ctx.fillStyle = 'rgba(180, 83, 9, 0.45)';
          ctx.fillText(num, x, y);
        }
      },
      {
        id: 11,
        title: "Warm Pearl Glow",
        desc: "Highlight: warm ivory (#FFFBEB) with diffuse amber candle-glow aura. Lowlight: soft oyster pearl at 50% opacity.",
        specs: ["Highlight: Ivory + Amber Halo", "Lowlight: Oyster Pearl (#E2E8F0 at 50%)", "Vibe: Organic Warmth"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.95);
          ctx.font = `800 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
          ctx.shadowBlur = 6;
          ctx.strokeStyle = '#18120c';
          ctx.lineWidth = Math.max(3.2, fs * 0.12);
          ctx.strokeText(num, x, y);
          ctx.restore();

          ctx.save();
          ctx.shadowColor = 'rgba(251, 191, 36, 0.55)';
          ctx.shadowBlur = 8;
          ctx.fillStyle = '#fffbeb';
          ctx.fillText(num, x, y);
          ctx.restore();
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.88);
          ctx.font = `600 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.save();
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 2;
          ctx.fillStyle = 'rgba(254, 243, 199, 0.45)';
          ctx.fillText(num, x, y);
          ctx.restore();
        }
      },
      {
        id: 12,
        title: "Arcade Royal Gold",
        desc: "Highlight: solid vibrant gold (#FBBF24) with stark pitch-black stroke. Lowlight: subdued bronze (#B45309 at 50%) with faint outline.",
        specs: ["Highlight: Royal Gold + Stark Black", "Lowlight: Subdued Bronze (50%)", "Vibe: Arcade Punch"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.96);
          ctx.font = `900 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.strokeStyle = '#000000';
          ctx.lineWidth = Math.max(4, fs * 0.15);
          ctx.strokeText(num, x, y);

          ctx.fillStyle = '#fbbf24';
          ctx.fillText(num, x, y);
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.88);
          ctx.font = `700 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
          ctx.lineWidth = 2;
          ctx.strokeText(num, x, y);

          ctx.fillStyle = 'rgba(217, 119, 6, 0.50)';
          ctx.fillText(num, x, y);
        }
      },
      {
        id: 13,
        title: "Subtle Glass Watermark",
        desc: "Highlight: 88% translucent frosted white floating inside the dome. Lowlight: 35% translucent frosted wash melting into the bubble.",
        specs: ["Highlight: 88% Frosted White", "Lowlight: 35% Ambient Glass", "Vibe: Subtle Glass Integration"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.92);
          ctx.font = `700 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
          ctx.shadowBlur = 4;
          ctx.shadowOffsetY = 1.5;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
          ctx.fillText(num, x, y);
          ctx.restore();
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.84);
          ctx.font = `500 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
          ctx.shadowBlur = 2;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.fillText(num, x, y);
          ctx.restore();
        }
      },
      {
        id: 14,
        title: "Ice Cyan Sci-Fi",
        desc: "Highlight: electric ice-cyan (#E0F2FE) with #38BDF8 plasma rim. Lowlight: dormant HUD cyan-grey (#7DD3FC at 45%) readout.",
        specs: ["Highlight: Ice Cyan + Plasma Rim", "Lowlight: Dormant Cyan (#7DD3FC at 45%)", "Vibe: Sci-Fi / Cyber"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.94);
          ctx.font = `800 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.strokeStyle = '#040d1a';
          ctx.lineWidth = Math.max(3.8, fs * 0.14);
          ctx.strokeText(num, x, y);

          ctx.save();
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 10;
          ctx.fillStyle = '#e0f2fe';
          ctx.fillText(num, x, y);
          ctx.restore();
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.88);
          ctx.font = `600 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
          ctx.shadowBlur = 2;
          ctx.fillStyle = 'rgba(125, 211, 252, 0.45)';
          ctx.fillText(num, x, y);
          ctx.restore();
        }
      },
      {
        id: 15,
        title: "Charcoal Velvet Matte",
        desc: "Highlight: pitch charcoal (#111827) with pale ivory border (#FEF3C7). Lowlight: muted dark slate (#334155 at 55%) with faint edge.",
        specs: ["Highlight: Charcoal + Ivory Rim", "Lowlight: Slate (#334155 at 55%)", "Vibe: Editorial Elegance"],
        renderHighlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.95);
          ctx.font = `900 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.strokeStyle = '#fef3c7';
          ctx.lineWidth = Math.max(3, fs * 0.12);
          ctx.strokeText(num, x, y);

          ctx.fillStyle = '#111827';
          ctx.fillText(num, x, y);
        },
        renderLowlight: (ctx, x, y, r, num, gem) => {
          const fs = Math.round(r * 0.88);
          ctx.font = `700 ${fs}px Outfit, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.strokeStyle = 'rgba(254, 243, 199, 0.35)';
          ctx.lineWidth = 1.8;
          ctx.strokeText(num, x, y);

          ctx.fillStyle = 'rgba(30, 41, 59, 0.55)';
          ctx.fillText(num, x, y);
        }
      }
    ];

    const container = document.getElementById('mockupGrid');
    const tabCarved = document.getElementById('tabCarved');
    const tabClose = document.getElementById('tabClose');
    const tabTonal = document.getElementById('tabTonal');
    const tabThemed = document.getElementById('tabThemed');

    function renderCollection(stylesList, prefix) {
      container.innerHTML = '';
      const dpr = window.devicePixelRatio || 1;
      const bubbleR = 26;
      const spacing = 72;
      const startX = 46;
      const centerY = 34;

      stylesList.forEach(style => {
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div class="card-top">
            <span class="card-id">STYLE ${style.id}</span>
            <h2 class="card-title">${style.title}</h2>
          </div>
          <p class="card-desc">${style.desc}</p>
          
          <div class="comparison-section">
            <!-- Row 1: Highlight / Active State -->
            <div class="state-row">
              <div class="state-label-bar">
                <span class="state-badge active">● ACTIVE / IN-PLAY (HIGHLIGHT)</span>
                <span class="state-desc">Unfinished, high focus</span>
              </div>
              <div class="preview-canvas-wrap">
                <canvas id="canvas_hl_${prefix}_${style.id}" width="380" height="68"></canvas>
              </div>
            </div>

            <!-- Row 2: Lowlight / Goal Reached State -->
            <div class="state-row">
              <div class="state-label-bar">
                <span class="state-badge completed">✓ GOAL REACHED (LOWLIGHT)</span>
                <span class="state-desc">Finished, calm & frosted</span>
              </div>
              <div class="preview-canvas-wrap">
                <canvas id="canvas_ll_${prefix}_${style.id}" width="380" height="68"></canvas>
              </div>
            </div>
          </div>

          <div class="specs">
            ${style.specs.map(s => `<span class="spec-pill">${s}</span>`).join('')}
          </div>
        `;

        container.appendChild(card);

        // 1. Render Highlight Canvas
        const canvasHl = card.querySelector(`#canvas_hl_${prefix}_${style.id}`);
        const ctxHl = canvasHl.getContext('2d');
        canvasHl.width = 380 * dpr;
        canvasHl.height = 68 * dpr;
        canvasHl.style.width = '380px';
        canvasHl.style.height = '68px';
        ctxHl.scale(dpr, dpr);

        sampleGems.forEach((gem, idx) => {
          const bx = startX + idx * spacing;
          const by = centerY;

          ctxHl.save();
          renderer.renderStandaloneBubble(ctxHl, bx, by, bubbleR, gem.color, false);
          ctxHl.restore();

          ctxHl.save();
          const gemInfo = renderer.getGemColorInfo(gem.color);
          style.renderHighlight(ctxHl, bx, by, bubbleR, gem.num, gemInfo);
          ctxHl.restore();
        });

        // 2. Render Lowlight Canvas
        const canvasLl = card.querySelector(`#canvas_ll_${prefix}_${style.id}`);
        const ctxLl = canvasLl.getContext('2d');
        canvasLl.width = 380 * dpr;
        canvasLl.height = 68 * dpr;
        canvasLl.style.width = '380px';
        canvasLl.style.height = '68px';
        ctxLl.scale(dpr, dpr);

        sampleGems.forEach((gem, idx) => {
          const bx = startX + idx * spacing;
          const by = centerY;

          ctxLl.save();
          renderer.renderStandaloneBubble(ctxLl, bx, by, bubbleR, gem.color, true);
          ctxLl.restore();

          ctxLl.save();
          const gemInfo = renderer.getGemColorInfo(gem.color);
          style.renderLowlight(ctxLl, bx, by, bubbleR, gem.num, gemInfo);
          ctxLl.restore();
        });
      });
    }

    // Default to the new Carved & Etched Glass Variations!
    renderCollection(carvedStyles, 'carved');

    tabCarved.addEventListener('click', () => {
      tabCarved.classList.add('active');
      tabClose.classList.remove('active');
      tabTonal.classList.remove('active');
      tabThemed.classList.remove('active');
      renderCollection(carvedStyles, 'carved');
    });

    tabClose.addEventListener('click', () => {
      tabClose.classList.add('active');
      tabCarved.classList.remove('active');
      tabTonal.classList.remove('active');
      tabThemed.classList.remove('active');
      renderCollection(closeToneStyles, 'close');
    });

    tabTonal.addEventListener('click', () => {
      tabTonal.classList.add('active');
      tabCarved.classList.remove('active');
      tabClose.classList.remove('active');
      tabThemed.classList.remove('active');
      renderCollection(tonalStyles, 'tonal');
    });

    tabThemed.addEventListener('click', () => {
      tabThemed.classList.add('active');
      tabCarved.classList.remove('active');
      tabClose.classList.remove('active');
      tabTonal.classList.remove('active');
      renderCollection(themedStyles, 'themed');
    });
  </script>
</body>
